name: Testing

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: on
  PIP_NO_CLEAN: on
  PIP_NO_INPUT: on
  PIP_PREFER_BINARY: on
  PY_COLORS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Start containers
        run: docker compose up -d slapd mailpit neo4j mex-backend mssql sql-testing-seed

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -fsSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc unixodbc-dev

      - name: Cache requirements
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-requirements
        with:
          path: ~/.cache/pip
          key: ${{ env.cache-name }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ env.cache-name }}-

      - name: Cache environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-environment
        with:
          path: ~/.cache/uv
          key: ${{ env.cache-name }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ env.cache-name }}-

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14

      - name: Install requirements
        run: |
          echo ${{ matrix.python-version }} > .python-version
          make install

      - name: Wait for mex-backend readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v0/_system/check && exit 0
            sleep 2
          done
          echo "mex-backend did not become ready in time" >&2
          exit 1

      - name: Run test suite
        env:
          MEX_LDAP_URL: ldap://cn=admin,dc=ldapmock,dc=local:adminpass@localhost:636
          MEX_BACKEND_API_URL: http://localhost:8080/
          MEX_BACKEND_API_KEY: write_key
          MEX_EXTRACTORS_GRIPPEWEB__MSSQL_CONNECTION_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=GrippeWeb;UID=sa;PWD=MEx_testing1234;TrustServerCertificate=yes"
          MEX_EXTRACTORS_KVIS__MSSQL_CONNECTION_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=KVIS;UID=sa;PWD=MEx_testing1234;TrustServerCertificate=yes"
          MEX_EXTRACTORS_IFSG__MSSQL_CONNECTION_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=SurvNet3Meta;UID=sa;PWD=MEx_testing1234;TrustServerCertificate=yes"
        run: make test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs mex-backend neo4j

      - name: Cleanup containers
        if: always()
        run: docker compose down slapd mailpit neo4j mex-backend mssql sql-testing-seed
