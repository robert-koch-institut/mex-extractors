x-extractors-environment: &extractors-environment
  MEX_LDAP_URL: ldap://cn=admin,dc=ldapmock,dc=local:adminpass@ldapmock.local:636
  MEX_EXTRACTORS_BLUEANT__URL: http://http-test-server:8050/v0/bluework/
  MEX_EXTRACTORS_DATSCHA_WEB__URL: http://http-test-server:8050/v0/datscha_web/
  MEX_EXTRACTORS_CONFLUENCE_VVT__URL: http://http-test-server:8050/v0/confluence_vvt/
  MEX_EXTRACTORS_DROP_API_URL: http://http-test-server:8050/v0/drop/
  MEX_EXTRACTORS_IGS__URL: http://http-test-server:8050/v0/igs/
  MEX_EXTRACTORS_OPEN_DATA__URL: http://http-test-server:8050/v0/open_data/
  MEX_EXTRACTORS_OPEN_DATA__FALLBACK_UNIT: FG 99
  MEX_WIKI_API_URL: http://http-test-server:8050/v0/wikidata/w/api.php
  # trust the self-signed cert that slapd generates on startup, issued for `ldapmock.local`
  # (setting this to `false` via env does not work, mex-common parses it as a path)
  MEX_VERIFY_SESSION: /app/slapd-ssl/ldap.crt
services:
  postgres:
    image: postgres:16.13-trixie@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59 # PINNED! Do not update outside MX-2398
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-U", "dagster", "-d", "dagster" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
  dagster-daemon:
    build:
      context: .
    entrypoint: [ "dagster-daemon", "run", "-w", "workspace.yaml" ]
    depends_on:
      postgres:
        condition: service_healthy
      http-test-server:
        condition: service_healthy
      slapd:
        condition: service_healthy
    environment: *extractors-environment
    healthcheck:
      test: [ "CMD", "dagster-daemon", "liveness-check" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ./dagster-compose.yaml:/app/dagster/dagster.yaml:ro
      - dagster:/app/work:rw
      - slapd-ssl:/app/slapd-ssl:ro
  dagster-webserver:
    build:
      context: .
    ports:
      - 3000:3000
    # mex-webserver is dagster-webserver plus our /_system/* endpoints, see
    # mex/extractors/system/api.py. Note the Dockerfile default entrypoint runs
    # `dagster dev`, which spawns `python -m dagster_webserver` and so does not
    # pick up this console script - only this service serves /_system/*.
    entrypoint: [ "mex-webserver", "--host", "0.0.0.0", "-w", "workspace.yaml" ]
    depends_on:
      postgres:
        condition: service_healthy
      http-test-server:
        condition: service_healthy
      slapd:
        condition: service_healthy
    environment: *extractors-environment
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/_system/check', timeout=3).raise_for_status()" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - ./dagster-compose.yaml:/app/dagster/dagster.yaml:ro
      - dagster:/app/work:rw
      - slapd-ssl:/app/slapd-ssl:ro
  http-test-server:
    image: ghcr.io/robert-koch-institut/mex-testing:1.0.0@sha256:c853fae4c9612e9c1d15b264fa5a105e642eca048fe9f37681949d1ad9ee30c5
    ports:
      - 8050:8050
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8050/v0/_system/check', timeout=3).raise_for_status()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  slapd:
    image: thoteam/slapd-server-mock@sha256:f1f976cab47facefc1128d7ebd6b26e20c725fbb990b07e40e79801ec8b77b1f
    platform: linux/amd64
    ports:
      - 636:636
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-o", "tls_reqcert=never", "-H", "ldaps://localhost:636", "-b", "dc=ldapmock,dc=local", "-D", "cn=admin,dc=ldapmock,dc=local", "-w", "adminpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - ldapmock.local
    volumes:
      - ./assets/raw-data/ldap/:/bootstrap/
      - slapd-ssl:/etc/ldap/ssl
  mailpit:
    image: axllent/mailpit:v1.31@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - 1025:1025
      - 8025:8025
    environment:
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_UI_AUTH=user:password
  neo4j:
    image: neo4j:2026.09.0-community@sha256:6f3f17e72d69bb6f26b03f6186f5afb15a201f8b460bb69b0cd8030717f9f01a
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_usage__report_enabled=false
    ports:
      - 7687:7687
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mex-backend:
    image: ghcr.io/robert-koch-institut/mex-backend:4.4.0@sha256:ebeedd8301032978c06eed36cf968e8c98cd96c5b4e2804ad7e8e80c0661c517
    entrypoint: testing-backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      - MEX_GRAPH_URL=neo4j://neo4j:7687
      - MEX_BACKEND_API_KEY_DATABASE={"write":["write_key"]}
      - MEX_DEBUG=true
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/v0/_system/check', timeout=3).raise_for_status()" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest@sha256:ef0b8db33970ecd01bed49c3a84a1d083c435a9891718df619298b67b352e74a
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MEx_testing1234
    ports:
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  sql-testing-seed:
    image: ghcr.io/robert-koch-institut/mex-testing/sql-testing-seed:1.0.0@sha256:612bdb7b11a242c91341d3daeb1ce6fab6cb55492f34d38563a013853551465d
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - MEX_TESTING_SQL_SEED_HOST=mssql
      - MEX_TESTING_SQL_SEED_SA_PASSWORD=MEx_testing1234
    restart: "no"
volumes:
  pgdata:
  slapd-ssl:
  mssql:
  dagster:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: mode=1777
