python_logs:
  managed_python_loggers:
    - mex
telemetry:
  enabled: false
storage:
  postgres:
    postgres_db:
      hostname: postgres
      username: dagster
      password: dagster
      db_name: dagster
      # sqlalchemy>=2.1 defaults `postgresql://` to psycopg 3, we ship psycopg2
      scheme: postgresql+psycopg2
