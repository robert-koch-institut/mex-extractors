belongsTo:
  - fieldInPrimarySource: label of SQL-table
    mappingRules:
      - rule: Use identifierInPrimarySource of the corresponding variable group. Assign stableTargetId
          of the variable-group item.
hadPrimarySource:
  - mappingRules:
      - rule: Assign stableTargetId of primary source with identifier 'grippeweb' in /raw-data/primary-sources/primary-sources.json.
identifierInPrimarySource:
  - fieldInPrimarySource: label of the column
    examplesInPrimarySource:
      - GuidTeilnehmer
      - Spitzname
      - Koerpergroesse_in_cm
    mappingRules:
      - rule: Use value as given.
label:
  - fieldInPrimarySource: label of the column
    examplesInPrimarySource:
      - GuidTeilnehmer
      - Spitzname
      - Koerpergroesse_in_cm
      - Id
      - StartedOn
      - RepeatAfterDays
    mappingRules:
      - rule: Extract original value.
usedIn:
  - mappingRules:
      - rule: Assign stableTargetId of item described by grippeweb resource_grippeweb mapping
